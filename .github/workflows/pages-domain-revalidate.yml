name: Revalidate Pages custom domain
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-domain-revalidate.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing custom-domain setting and request idempotent recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/FLABDUL/period-place/pages"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsSL "${auth[@]}" "$api" > /tmp/pages-before.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/pages-before.json'))
          assert p['cname'] == 'periodplace.org', 'Refusing to change unexpected custom domain'
          print('Before: cname=',p.get('cname'),'https_enforced=',p.get('https_enforced'),'cert=',p.get('https_certificate'))
          PY
          status=$(curl -sSL -o /tmp/recheck-response -w '%{http_code}' -X PUT "${auth[@]}" -H 'Content-Type: application/json' -d '{"cname":"periodplace.org"}' "$api")
          echo "GitHub Pages revalidation request: HTTP $status"
          if [ "$status" = "204" ]; then
            echo 'Revalidation request accepted; final HTTPS must still be verified independently.'
          else
            echo 'GitHub rejected updating Pages settings with workflow permissions.'
            head -c 700 /tmp/recheck-response
            echo ''
            exit 1
          fi
